spring.application.name=baozi-store
spring.application.name=baozi-store

# Conexao com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/baozi_store
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Criacao e atualizacao das tabelas
spring.jpa.hibernate.ddl-auto=update

# Mostra os comandos SQL no console
spring.jpa.show-sql=true

# Porta da API
server.port=8080

# Exibe as mensagens de erro definidas nos controllers
spring.web.error.include-message=always